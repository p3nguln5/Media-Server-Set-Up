services:
  gluetun: # See gluetun's github page for more VPN service options: https://github.com/qdm12/gluetun
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 6881:6881              # qBittorrent torrent port (tcp)
      - 6881:6881/udp          # qBittorrent torrent port (udp)
      - 8085:8085              # qBittorrent WebUI
      - 9696:9696              # Prowlarr
      - 8989:8989              # Sonarr
      - 7878:7878              # Radarr
      - 5055:5055              # Overseerr
    volumes:
      - ./gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad       # Change to your VPN provider
      - VPN_TYPE=wireguard                 # Mullvad deprecated OpenVPN Jan 2026 — use WireGuard
      - WIREGUARD_PRIVATE_KEY=             # Your WireGuard private key
      - WIREGUARD_ADDRESSES=               # Your WireGuard address (IPv4 ONLY, e.g., 10.x.x.x/32 — strip any IPv6 fc00:: address or gluetun will error)
      # - SERVER_COUNTRIES=                # Country for VPN (comma separated)
      # - SERVER_CITIES=                   # City for VPN (comma separated)
      - TZ=America/Chicago                 # Change to your timezone
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    shm_size: 2gb                          # Default Docker /dev/shm is 64MB — too small for headless Chromium, causes crashes
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - BROWSER_TIMEOUT=80000
      - TZ=America/Chicago
    depends_on:
      gluetun:
        condition: service_healthy          # CRITICAL: wait for VPN tunnel to be UP, not just container running
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=docker
      # - PLEX_CLAIM=                      # Optional — or claim via SSH tunnel (see README)
    volumes:
      - ./plex:/config
      - /path/to/media/tv:/tv
      - /path/to/media/movies:/movies
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000                          # Match the UID that owns your media files — do NOT use 0 (root)
      - PGID=1000                          # Match the GID that owns your media files — do NOT use 0 (root)
      - TZ=America/Chicago
      - WEBUI_PORT=8085
    volumes:
      - ./qbit:/config
      - /path/to/media/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy          # CRITICAL: wait for VPN tunnel to be UP, not just container running
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000                          # Match your media file owner UID
      - PGID=1000                          # Match your media file owner GID
      - TZ=America/Chicago
    volumes:
      - ./sonarr:/config
      - /path/to/media/tv:/tv
      - /path/to/media/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000                          # Match your media file owner UID
      - PGID=1000                          # Match your media file owner GID
      - TZ=America/Chicago
    volumes:
      - ./radarr:/config
      - /path/to/media/movies:/movies
      - /path/to/media/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./overseerr:/config
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
